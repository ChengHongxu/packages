name: Update Conda Channel
on:
  repository_dispatch:
    types: [add-conda-package]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name'
        required: true
      version:
        description: 'Package version'
        required: true
      run_id:
        description: 'GitHub Actions run ID from source repo'
        required: true

jobs:
  update-conda-channel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packages repo
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pixi and rattler-index
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          export PATH="$HOME/.pixi/bin:$PATH"
          pixi global install rattler-index

      - name: Add pixi to PATH
        run: echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Get package info
        id: pkg
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "PACKAGE=${{ github.event.client_payload.package }}" >> $GITHUB_OUTPUT
            echo "VERSION=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
            echo "RUN_ID=${{ github.event.client_payload.run_id }}" >> $GITHUB_OUTPUT
          else
            echo "PACKAGE=${{ github.event.inputs.package }}" >> $GITHUB_OUTPUT
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "RUN_ID=${{ github.event.inputs.run_id }}" >> $GITHUB_OUTPUT
          fi

      - name: Download conda packages
        uses: actions/download-artifact@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ChengHongxu/${{ steps.pkg.outputs.PACKAGE }}
          run_id: ${{ steps.pkg.outputs.RUN_ID }}
          pattern: conda-package-*
          path: new-packages
          merge-multiple: true

      - name: Copy packages to conda channel
        run: |
          echo "Downloaded artifact contents:"
          find new-packages -type f -name '*.conda' | sort

          copied=0
          for platform in linux-64 linux-aarch64 osx-64 osx-arm64 win-64 noarch; do
            if compgen -G "new-packages/$platform/*.conda" > /dev/null; then
              mkdir -p "conda/$platform"
              cp -v new-packages/$platform/*.conda "conda/$platform/"
              copied=$((copied + 1))
            fi
          done

          if [ "$copied" -eq 0 ]; then
            echo "::error::No conda packages found in any platform subdirectory."
            echo "Packages in new-packages/broken/ mean the build produced a package that failed its tests."
            exit 1
          fi

      - name: Update repodata
        run: rattler-index fs conda --force

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conda/
          git diff --staged --quiet || git commit -m "conda: add ${{ steps.pkg.outputs.PACKAGE }} v${{ steps.pkg.outputs.VERSION }}"
          git push
