name: Update Conda Channel
on:
  repository_dispatch:
    types: [add-conda-package]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name'
        required: true
      version:
        description: 'Package version'
        required: true
      run_id:
        description: 'GitHub Actions run ID from source repo'
        required: true

jobs:
  update-conda-channel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packages repo
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pixi and rattler-build
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH
          export PATH="$HOME/.pixi/bin:$PATH"
          pixi global install rattler-build

      - name: Get package info
        id: pkg
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "PACKAGE=${{ github.event.client_payload.package }}" >> $GITHUB_OUTPUT
            echo "VERSION=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
            echo "RUN_ID=${{ github.event.client_payload.run_id }}" >> $GITHUB_OUTPUT
          else
            echo "PACKAGE=${{ github.event.inputs.package }}" >> $GITHUB_OUTPUT
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "RUN_ID=${{ github.event.inputs.run_id }}" >> $GITHUB_OUTPUT
          fi

      - name: Download conda packages
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: release.yml
          repo: ChengHongxu/${{ steps.pkg.outputs.PACKAGE }}
          run_id: ${{ steps.pkg.outputs.RUN_ID }}
          name: conda-packages
          path: new-packages

      - name: Copy packages to conda channel
        run: |
          for platform in linux-64 osx-64 osx-arm64 win-64 noarch; do
            if [ -d "new-packages/$platform" ]; then
              mkdir -p conda/$platform
              cp -v new-packages/$platform/*.conda conda/$platform/ || true
            fi
          done

      - name: Update repodata
        run: |
          for platform in linux-64 osx-64 osx-arm64 win-64 noarch; do
            if [ -d "conda/$platform" ] && [ "$(ls -A conda/$platform/*.conda 2>/dev/null)" ]; then
              echo "Updating repodata for $platform..."
              rattler-index --channel-dir conda --subdir $platform
            fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conda/
          git diff --staged --quiet || git commit -m "conda: add ${{ steps.pkg.outputs.PACKAGE }} v${{ steps.pkg.outputs.VERSION }}"
          git push
